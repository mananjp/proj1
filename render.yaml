# Render Blueprint specification for single container deployment with local storage
# Learn more: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kanban-task-management
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: GROQ_API_KEY
        sync: false # Optional: set your Groq key for AI insights
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # MONGODB_URI is optional! If omitted, the container runs its own local embedded MongoDB.
      - key: MONGODB_URI
        value: mongodb://127.0.0.1:27017/taskdb
